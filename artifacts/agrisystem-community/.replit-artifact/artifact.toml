kind = "web"
previewPath = "/"
title = "Agrisystems Community Food Access"
description = "A community food access MVP that helps households join transparent group purchases from trusted agricultural suppliers, track funding progress, and coordinate pickup."
version = "1.0.0"
id = "artifacts/agrisystem-community"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19631

[services.development]
run = "pnpm --filter @workspace/agrisystem-community run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/agrisystem-community", "run", "build" ]
serve = "static"
publicDir = "artifacts/agrisystem-community/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19631"
BASE_PATH = "/"
